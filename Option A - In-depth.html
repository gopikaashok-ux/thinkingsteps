/* ---------- ask orb ---------- */
.orb{position:relative;display:inline-block;width:52px;height:52px;border-radius:50%;flex:none;background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.95) 0 7%,transparent 24%),radial-gradient(circle at 74% 84%,#c4e78f,transparent 58%),linear-gradient(155deg,#4dbbbb,#0fa3a3 42%,#3ed598);box-shadow:inset 0 -6px 10px rgba(4,48,33,.3),inset 0 3px 6px rgba(255,255,255,.6),0 0 22px rgba(196,231,143,.5);animation:breathe 5s ease-in-out infinite}

@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}@keyframes breathe{50%{transform:scale(1.05)}}/* ---------- Majlis mascot · motion states from "Majlis Mascot Animations", switched by what Majlis is doing ---------- */
.orb{--s:52px}.orb--xs{--s:22px}.orb--sm{--s:28px}.orb--md{--s:48px}.orb--lg{--s:64px}.orb--xl{--s:92px}.logo .orb{--s:30px}.cs__av .orb{--s:42px}.agnow .orb{--s:24px}.cs__ac .orb{--s:22px}
.eyes{transition:transform .25s ease-out}.eyes b{transform-origin:50% 50%}
.m-sat,.m-wave{position:absolute;pointer-events:none;display:none}
/* look around · at rest */
.orb.m-look .eyes{animation:m-look 6s ease-in-out infinite}
@keyframes m-look{0%,18%,100%{transform:translate(0,0)}24%,40%{transform:translate(-9%,-2%)}46%,62%{transform:translate(9%,-2%)}68%,80%{transform:translate(0,4%)}}
/* follow cursor · empty chat (JS aims the eyes) */
.orb.m-follow .eyes{transition:transform .12s ease-out}
/* listening · mic on */
.orb.m-listen{animation:breathe 1.1s ease-in-out infinite}
.orb.m-listen .eyes b{animation:m-listenEye 1.1s ease-in-out infinite}@keyframes m-listenEye{50%{transform:scaleY(1.18)}}
.orb.m-listen::before,.orb.m-listen::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #3ed598;animation:m-ripple 1.8s ease-out infinite;pointer-events:none}.orb.m-listen::after{animation-delay:.9s}

.orb.m-think .eyes{animation:m-thinkLook 3s ease-in-out infinite}@keyframes m-thinkLook{0%,100%{transform:translate(6%,-7%)}50%{transform:translate(-4%,-7%)}}

.m-sat i{position:absolute;top:0;left:50%;width:9%;height:9%;min-width:3px;min-height:3px;margin-left:-4.5%;border-radius:50%;background:#3ed598;box-shadow:0 0 calc(var(--s) * .09) #3ed598}
.m-sat i:nth-child(2){top:auto;bottom:0;width:6%;height:6%;margin-left:-3%;background:#c4e78f;box-shadow:0 0 calc(var(--s) * .09) #c4e78f}
@keyframes m-spin{to{transform:rotate(360deg)}}

.orb.m-load{overflow:hidden}
.orb.m-load::after{content:"";position:absolute;inset:-30%;background:conic-gradient(from 0deg,transparent 0 70%,rgba(255,255,255,.55) 82%,transparent 92%);animation:m-spin 1.4s linear infinite;mix-blend-mode:soft-light;pointer-events:none}

.csd__lg{display:flex;flex-wrap:wrap;gap:6px 14px}.csd__lg li{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}.csd__lg i{width:8px;height:8px;border-radius:3px;background:var(--c)}.csd__lg span{color:var(--ink3);font-variant-numeric:tabular-nums}

.cs__now{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:var(--r);background:var(--card-s);border:1px solid var(--cardline);box-shadow:var(--shadow)}:root[data-theme="dark"] .cs__now{background:rgba(255,255,255,.06)}

.cs__lbl time{margin-inline-start:auto;letter-spacing:0;color:var(--ink3);font-variant-numeric:tabular-nums}
.cs__who{display:flex;align-items:center;gap:12px}.cs__av{width:42px;height:42px;flex:none}.cs__av .orb{width:42px;height:42px}
.cs__nm>.swp__i{flex-direction:column;align-items:flex-start;gap:2px}.cs__nm b{font:600 17px/22px var(--font)}.cs__nm small{font-size:12.5px;color:var(--ink3)}

.cs__bar{display:flex;gap:3px}.cs__bar i{position:relative;flex:1;height:4px;border-radius:2px;background:var(--tile2);overflow:hidden}
.cs__bar i b{position:absolute;inset:0;border-radius:inherit;background:var(--accent);transform:scaleX(0);transform-origin:left center;transition:transform .6s cubic-bezier(.2,.8,.2,1)}:root[dir="rtl"] .cs__bar i b{transform-origin:right center}
.cs__bar i.is-done b{transform:scaleX(1)}
.cs__bar i.is-run b{transform:scaleX(1);background:linear-gradient(90deg,var(--accent-soft),var(--accent),var(--accent-soft)) 0 0/200% 100%;animation:barRun 1.2s linear infinite}@keyframes barRun{to{background-position:-200% 0}}

@media (max-width:1100px){.chat{grid-template-columns:0 minmax(0,1fr) 0}.chat.is-steps{grid-template-columns:0 minmax(0,1fr) 340px}.cs{width:340px}.chat__h .chat__src{display:none}}

/* ---------- microinteractions ---------- */
/* numbers: count-up + change flash with a floating delta chip */
.cu-up{animation:cuUp 1.4s ease}.cu-dn{animation:cuDn 1.4s ease}@keyframes cuUp{0%,35%{color:var(--accent)}}@keyframes cuDn{0%,35%{color:var(--bad)}}
.cu-chip{position:absolute;z-index:6;font:600 11px/1 var(--font);padding:4px 7px;border-radius:99px;pointer-events:none;white-space:nowrap;animation:cuChip 2s cubic-bezier(.2,.8,.2,1) forwards}.cu-chip--up{background:var(--ok-soft);color:var(--accent)}.cu-chip--dn{background:var(--bad-soft);color:var(--bad)}
@keyframes cuChip{0%{opacity:0;transform:translateY(6px)}15%,72%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-8px)}}
.mi-bump{display:inline-block;animation:miBump .45s cubic-bezier(.2,.8,.2,1)}@keyframes miBump{40%{transform:scale(1.32)}}
/* chart scrub */
.ac__p{touch-action:pan-y}.ac__c.is-scrub .ac__v,.ac__c.is-scrub .ac__d{opacity:1}.ac__c.is-scrub .ac__tip{display:flex}
.rvt{position:relative}.rvt>svg.scr{cursor:crosshair;touch-action:pan-y}
.scr__g{position:absolute;top:0;bottom:0;width:0;border-inline-start:1px solid var(--line2);pointer-events:none;opacity:0;transition:opacity .15s}.scr__g.is-on{opacity:1}
.scr__g i{position:absolute;width:11px;height:11px;margin:-5.5px 0 0 -6px;border-radius:50%;background:var(--card-s);border:2.5px solid var(--c1);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.scr__g b{position:absolute;transform:translate(-50%,-100%);padding:5px 8px;border-radius:8px;background:var(--dark);color:var(--dark-ink);font:600 11px/1 var(--font);white-space:nowrap}
.scr__g.is-l b{transform:translate(0,-100%)}.scr__g.is-r b{transform:translate(-100%,-100%)}
/* graph <-> text: sliding thumb, body fades out then rows rise in */
.vt{position:relative}.vt button{position:relative;z-index:1}.vt button.is-on{background:transparent!important;box-shadow:none!important}
.vt::before{content:"";position:absolute;top:3px;bottom:3px;inset-inline-start:3px;width:28px;border-radius:99px;background:var(--card-s);box-shadow:0 1px 3px rgba(0,0,0,.12);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.vt:has(button:last-child.is-on)::before{transform:translateX(calc(100% + 2px))}:root[dir="rtl"] .vt:has(button:last-child.is-on)::before{transform:translateX(calc(-100% - 2px))}
:root[data-theme="dark"] .vt::before{background:rgba(255,255,255,.14)}.w--hi .vt::before{background:#fff}
@container w (max-width:300px){.vt::before{width:24px}}
.w__b.mi-out{opacity:0;transform:translateY(-4px);transition:opacity .14s,transform .14s}
/* approve: check fills, row folds, toast with undo + countdown */
.mi-ok{background:var(--accent)!important;color:#fff!important;animation:miPop .35s cubic-bezier(.2,.8,.2,1)}.mi-ok svg *{stroke-dasharray:24;animation:miDraw .32s ease both}
@keyframes miPop{40%{transform:scale(1.12)}}@keyframes miDraw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
.toast{position:relative;overflow:hidden}.toast__t{position:absolute;inset-inline:0;bottom:0;height:3px;background:var(--hi);transform-origin:left;animation:miShrink 5s linear forwards}:root[dir="rtl"] .toast__t{transform-origin:right}@keyframes miShrink{to{transform:scaleX(0)}}
/* hold to sign */
[data-hold]{position:relative;overflow:hidden;isolation:isolate}[data-hold]::after{content:"";position:absolute;inset:0;z-index:-1;background:color-mix(in srgb,currentColor 24%,transparent);transform:scaleX(0);transform-origin:left;transition:transform .3s ease-out}
:root[dir="rtl"] [data-hold]::after{transform-origin:right}[data-hold].is-holding::after{transform:scaleX(1);transition:transform 1s linear}
.mi-nudge{animation:miNudge .4s}@keyframes miNudge{20%,60%{transform:translateX(-3px)}40%,80%{transform:translateX(3px)}}
/* task tick: the box draws its check, a line sweeps through the text */
.mi-tick .chk__b svg *{stroke-dasharray:24;animation:miDraw .3s .05s ease both}
.tkr__m b{align-self:flex-start;max-width:100%;background:linear-gradient(currentColor,currentColor) no-repeat 0 55%/0 1.5px;transition:background-size .35s ease,color .3s}
.tkr input:checked~.tkr__m b{text-decoration:none;background-size:100% 1.5px;color:var(--ink3)}

.hdot{position:relative}.hdot.is-ping::after{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;animation:miPing 1.2s cubic-bezier(0,0,.2,1) 2}@keyframes miPing{to{transform:scale(3.2);opacity:0}}
.sech small.is-new{animation:miIn .5s cubic-bezier(.2,.8,.2,1)}@keyframes miIn{from{opacity:0;transform:translateY(-5px)}}
/* refresh: spinner on the sync chip, shimmer over each widget, then the chip turns green */
button.sync{border-radius:99px;padding:5px 10px;margin:-5px 0;transition:background .2s,color .2s}button.sync:hover{background:var(--tile);color:var(--ink)}
.sync.is-spin .live{background:transparent;box-shadow:none;border:2px solid var(--accent);border-top-color:transparent;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.sync.is-fresh{background:var(--ok-soft);color:var(--accent)}
.w.mi-sk .w__b{position:relative}.w.mi-sk .w__b>*{opacity:0;transition:opacity .2s}
.w.mi-sk .w__b::after{content:"";position:absolute;inset:0;border-radius:12px;background:linear-gradient(90deg,var(--tile) 25%,var(--tile2) 50%,var(--tile) 75%) 0 0/300% 100%;animation:miSh 1.1s linear infinite}@keyframes miSh{to{background-position:-150% 0}}
/* hover lift + soft light that follows the pointer; tiny squeeze on press */
body:not(.is-edit) .w:hover{transform:translateY(-2px);box-shadow:var(--shadow2)}

/* ---------- Ask box tools · attach + agent picker, built from the dashboard's own tokens (pill box, chips, pop, palette rows) ---------- */

.ask__in .ask__tools .ic-btn svg{transition:transform .2s}.ask__in .ask__tools .ic-btn.is-open svg{transform:rotate(45deg)}

.agc:hover{background:var(--tile2)}.agc>span:not(.ag):not(.orb){overflow:hidden;text-overflow:ellipsis}
.agc.is-pick{background:var(--accent-soft);color:var(--accent-ink)}
.agc .chev{color:var(--ink3);transition:transform .2s}.agc.is-open .chev{transform:rotate(180deg)}
.agc .ag{border-radius:50%}
@media (max-width:620px){.agc>span:not(.ag):not(.orb){display:none}.agc{padding-inline-end:8px}}

/* attachments sit under the box, like the hint line */
.ask__files{display:flex;flex-wrap:wrap;gap:8px;padding:2px 6px}
.afile{display:inline-flex;align-items:center;gap:8px;height:40px;max-width:240px;padding:0 5px;border-radius:99px;background:var(--card-s);border:1px solid var(--line);box-shadow:var(--shadow);animation:fade .25s}
:root[data-theme="dark"] .afile{background:rgba(255,255,255,.07)}
.afile>img{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:none}
.afile__ic{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);flex:none}
.afile__m{display:flex;flex-direction:column;gap:1px;min-width:0;padding-inline-end:4px}
.afile__m b{font:600 12.5px/15px var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.afile__m small{font-size:11px;line-height:13px;color:var(--ink3)}
.afile__x{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;color:var(--ink3);flex:none}.afile__x:hover{background:var(--tile2);color:var(--ink)}

/* popovers · same surface as the notifications pop and search results */
.agm{position:fixed;z-index:120;display:flex;flex-direction:column;width:340px;max-width:calc(100vw - 24px);border-radius:var(--r);background:var(--pop);border:1px solid var(--line);box-shadow:var(--shadow2);overflow:hidden;animation:fade .18s}

.agm__r .ag{width:34px;height:34px;border-radius:10px}

.agm__m{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}.agm__m b{font:600 13.5px/18px var(--font)}.agm__m small{font-size:12px;line-height:16px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.agm__r:is(:hover,.is-hi,.is-sel) .agm__pin,.agm__pin.is-on,.agm__pin:focus-visible{opacity:1}.agm__pin:hover{background:var(--tile2);color:var(--ink)}.agm__pin.is-on{color:var(--accent)}.agm__r.is-sel .agm__pin{color:var(--hi-ink)}

/* agent suggestions · tap one to drop it into the box (it is not sent until you press send) */

.chat__f:is(.is-rec,.is-tx,.is-ready,.is-miss)>.ask__sug{display:none}

.msg--u>.mu{display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:72%;padding:0;background:none;border-radius:0;color:var(--ink)}

.bmb{display:flex;flex-direction:column;gap:9px}

.bmb__n{display:flex;flex-direction:column;min-width:0}.bmb__n b{font:500 13px/17px var(--font)}.bmb__n small{font-size:11px;line-height:14px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  projects: { group: 'work', pageOnly: true, icon: 'layout', viz: true, sizes: { S: [3, 2], M: [4, 3], L: [6, 4], XL: [8, 4] }, def: 'M', min: [3, 2], max: [12, 7],

  tasks: { group: 'work', icon: 'check', viz: true, sizes: { S: [3, 2], M: [4, 3], L: [6, 4], XL: [8, 4] }, def: 'M', min: [3, 2], max: [12, 7],
    count: () => S.tasks.filter(x => !x.done).length,
    render({ v, w, h, view }) { const ts = S.tasks, done = ts.filter(x => x.done).length, pct = Math.round(done / ts.length * 100);
      if (view === 'viz') { const od = ts.filter(x => !x.done && x.d < 0), todo = ts.filter(x => !x.done && x.d >= 0), today = ts.filter(x => !x.done && x.d === 0), nx = [...od, ...today, ...todo].sort((a, b) => a.d - b.d || (a.at || '99').localeCompare(b.at || '99'))[0];
        const bat = `<div class="bat" role="img" aria-label="${done} / ${ts.length}">${[...ts.filter(x => x.done).map(() => 'd'), ...od.map(() => 'o'), ...todo.map(() => '')].map(c => `<i class="${c}"></i>`).join('')}</div>`;

        const facts = `<div class="bfxs">${fx(t('q.today'), today.length, t('left'), 'What is left for me today?')}${nx ? fx(t('gv.next'), nx.at || whenOf(nx.d), esc(nx.sh || nx.tx), `Help me with: ${nx.tx}`) : ''}${fx(t('q.overdue'), od.length, od.length ? t('gv.oldest', { n: -Math.min(...od.map(x => x.d)) }) : '✓', 'What is overdue and how do I clear it?')}</div>`;
        if (v === 's') return `<div class="arb arb--xl"><strong>${pct}%</strong></div>${bat}`; if (v === 'wide') return `<div class="arw"><div>${head}</div><div style="flex:1;display:flex;flex-direction:column;gap:8px;min-width:0">${bat}${lg}</div></div>`;
        return `${head}${bat}${lg}${bodyH(h) >= 200 ? facts : ''}`; }

      const head = (k, n) => `<div class="tkg"><span>${t('q.' + k)}</span><em>${n}</em></div>`, budget = bodyH(h) - 24;

      return `<div class="tkl" style="gap:0">${html}</div>${prev.length ? `<div class="tkf"><span>${esc(names.join(' · '))}${prev.length > 2 ? ' +' + (prev.length - 2) : ''}</span>${arLink(t('q.allTasks'), 'ask-open', ' data-q="Show all my tasks"')}</div>` : ''}`; } },

  risks: { group: 'finance', pageOnly: true, icon: 'alert', viz: true, sizes: { S: [3, 2], M: [4, 3], L: [6, 4], XL: [8, 4] }, def: 'M', min: [3, 2], max: [12, 7],

  function leadText(m) { const { a, b, win } = lead(m), d = Math.abs(a - b).toFixed(1); return `${ico('check', 15)}<span>With these weights <b>${ESC(m.names[win])}</b> leads by <b>${d}</b> points (${a.toFixed(1)} vs ${b.toFixed(1)}).</span>${win === 1 ? '<span class="tag tag--warn">Changed from the default</span>' : ''}`; }

      <div><h5>Assessment ${prov('ai')}</h5><p>B looks cheaper only because it leaves out data migration. Like for like, A is about USD 0.8m cheaper over five years and less risky; B is faster.</p></div></div>`; }

  const need = () => `<div class="ans-empty"><span class="ae__ic">${ico('file', 18)}</span><div><b>Attach the proposal you want evaluated</b><p>Add one proposal for a detailed assessment, or two to compare them side by side. I score each against six weighted criteria (strategic fit, financial case, delivery, risk, governance, people and ESG), re-check the numbers against the company plan and policy, and recommend a decision.</p>

  const draft = () => { const one = LAST.type === 'one', qs = one ? ONE.questions : TWO.questions;

      <div class="ans-a"><button class="btn btn--dark btn--sm" data-act="toast" data-m="Sent (demo)">Send</button><button class="btn btn--ghost btn--sm">Edit</button></div>`; };
  const path = () => { if (LAST.type === 'one') { const base = total1(ONE.crit), crit = ONE.crit.map(c => c.slice()); ONE.path.forEach(([k, , to]) => { crit.find(c => c[0] === k)[2] = to; }); const after = total1(crit);
      return `<div class="pbx"><div class="rsp" style="gap:12px"><p>To reach a clear <b>approve</b> (80 or more) from ${Math.round(base)}, four things need to change. Together they would lift the score to about <b>${Math.round(after)}</b>.</p><div class="tw"><table class="pb-tbl"><thead><tr><th>Criterion</th><th>Now</th><th>Needed</th><th>What would get it there</th><th>Points</th></tr></thead><tbody>${ONE.path.map(([k, from, to, how]) => { const w = ONE.crit.find(c => c[0] === k)[1]; return `<tr><td>${k}</td><td>${from.toFixed(1)}</td><td class="is-us">${to.toFixed(1)}</td><td style="white-space:normal;text-align:start">${how}</td><td>+${(w * (to - from) / 5).toFixed(1)}</td></tr>`; }).join('')}</tbody></table></div><div class="cav">${ico('alert', 16)}<span>These are the changes the proposer controls. Scores would be re-assessed on the revised proposal.</span></div></div></div>`; }
    const base = [15, 25, 20, 20, 10, 10]; return `<div class="pbx"><div class="rsp" style="gap:12px"><p><b>${ESC(LAST.names[1])}</b> would become the better choice only if <b>speed of delivery</b> mattered far more than risk and vendor strength. For example, with delivery weighted at 40% and risk at 5%, the two finish level.</p><p>Two changes in B's offer would close most of the gap without changing the weights:</p><ul class="ans-l">${['Price and plan data migration, removing the USD 0.9m uncertainty', 'Confirm in-country hosting and extend the warranty to 12 months'].map(x => `<li class="bl bl--n"><i></i><span><b>${x}</b></span></li>`).join('')}</ul><p style="font-size:13px;color:var(--ink3)">Default weights: ${TWO.crit.map(([k], i) => `${k.toLowerCase()} ${base[i]}%`).join(', ')}. You can try other weights in the comparison above.</p></div></div>`; };

  function answer(q) { const fs = files().splice(0), mode = MODE || modeFor(q); MODE = null; const id = 'ev' + Date.now().toString(36);

    if (mode === 'one') { const m = { id, kind: 'one', name: short(fs[0].n), file: fs[0].n, view: 'visual', st: { open: [] }, next: ['Draft questions for the proposer', 'What would it take to reach a clear approve?'] }; M.push(m); LAST = { type: 'one', names: [m.name] };

    const { a, b } = lead(m);
    return [shell(m, `${m.names[0]} vs ${m.names[1]}`, 'Evaluation · comparison of two proposals', 'var(--c4)', [['file', '2 proposals'], ['layout', 'Same 6 criteria for both'], ['dollar', 'Five-year cost, like for like']], `Prefer <b>${ESC(m.names[0])}</b> (${Math.round(a)} vs ${Math.round(b)}). ${ESC(m.names[1])} looks cheaper, but it leaves out data migration; like for like it costs about USD 0.8m more over five years and carries more delivery risk. Its advantage is speed: 11 months in three phases.`, mm => mm.view === 'visual' ? twoVisual(mm) : twoText(mm)) + (fs.length > 2 ? `<p class="ans-n">${fs.length - 2} more ${fs.length - 2 > 1 ? 'proposals were' : 'proposal was'} attached. I compare two at a time; ask again with the others to compare them.</p>` : ''), ['Proposals', 'Company plan']]; }

  /* ---------- interactions ---------- */
  const mOf = el => { const a = el.closest('[data-m]'); return a && M.find(m => m.id === a.dataset.m); };
  function body(m) { return m.kind === 'one' ? (m.view === 'visual' ? oneVisual(m) : oneText(m)) : (m.view === 'visual' ? twoVisual(m) : twoText(m)); }
  function repaint(m) { const art = $(`[data-m="${m.id}"]`); if (!art) return; const b = $('[data-body]', art); b.innerHTML = body(m); b.classList.remove('pb-view'); void b.offsetWidth; b.classList.add('pb-view'); persist(m); }

  function attachSample(kind) { S.att.splice(0); SAMPLE[kind].forEach(([n, size]) => S.att.push({ id: 'f' + Math.random().toString(36).slice(2, 8), n, size, img: false, url: '' })); cmpPaint(); }
  const TRY = [['single', 'Give me a detailed assessment of this proposal.', '1 sample proposal'], ['compare', 'Compare these two proposals and recommend one.', '2 sample proposals'], ['need', 'Evaluate a proposal for me.', 'no attachment']];

    $(`[data-evo="${r.dataset.evwI}"]`, art).textContent = r.value + '%'; const { a, b, win } = lead(m); [a, b].forEach((v, i) => { $(`[data-evt="${i}"]`, art).textContent = Math.round(v); const [vd, vc] = verdict(v), tg = $(`[data-evv="${i}"]`, art); tg.textContent = vd; tg.className = `tag ${vc}`; });

/* ---------- Evaluation agent · hooks into this dashboard's own Try row, placeholder, cards and voice ---------- */
function evTryHTML() { return EV.TRY.map(([k, q, tag]) => `<button type="button" class="sqc sqc--ag sqc--evt" data-evtry="${k}" title="${k === 'need' ? 'Fills the question without an attachment' : 'Attaches ' + tag + ' and fills the question'}">${ico(k === 'need' ? 'sparkles' : 'file', 14)}<span>${esc(q)}</span><em>${tag}</em></button>`).join(''); }

cmpSug();

{ const oc = openChat; openChat = function () { if (!CHAT_OPEN && !FRESH_SKIP) freshChat(); return oc.apply(this, arguments); }; }

/* ---------- orchestration modal · shows what Majlis and its agents are doing for the current question ---------- */

  const itemsOf = r => { const out = agentsOf(r).slice(0, 5).map(a => ({ id: a, ag: true })), srcs = [...new Set(r.steps.map(s => s.src).filter(Boolean))];
    for (const s of srcs) { if (out.length >= Math.max(3, agentsOf(r).length)) break; out.push({ id: 's:' + s, name: s, ic: SRC_IC[s] || 'file', col: SRC_COL[out.length % 4] }); }
